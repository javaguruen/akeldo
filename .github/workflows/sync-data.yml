name: Sync organization data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download JSON
        run: |
          curl -fsSL "https://akeldo.grunnbok.no/akeldo/aktoer" -o /tmp/organizations_new.json
          if [ ! -s /tmp/organizations_new.json ]; then
            echo "Downloaded file is empty or missing — aborting to preserve existing data"
            exit 1
          fi
          mv /tmp/organizations_new.json public/organizations.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/organizations.json
          git diff --cached --quiet || git commit -m "chore: sync organizations data"
          git push
