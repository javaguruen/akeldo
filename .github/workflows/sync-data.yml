name: Sync organization data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  
jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download JSON
        run: |
          curl -fsSL "https://akeldo.grunnbok.no/akeldo/aktoer" -o /tmp/organizations_raw.json
          if [ ! -s /tmp/organizations_raw.json ]; then
            echo "Downloaded file is empty or missing — aborting to preserve existing data"
            exit 1
          fi
          jq --arg ts "$(TZ=Europe/Oslo date +"%Y-%m-%dT%H:%M:%S%:z")" \
            '{ lastUpdated: $ts, akeldo: . }' \
            /tmp/organizations_raw.json > public/organizations.json

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/organizations.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: sync organizations data"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
